name: Temporary inventory inspection
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-font-inventory.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect remaining data-quality cases
        run: |
          python - <<'PY'
          import json,pathlib
          p=json.loads(pathlib.Path("font_inventory_20261112_151422.json").read_text(encoding="utf-8"))
          rows=p["records"]
          def brief(r):
              keys=("file","face_index","family_name","subfamily_name","full_name","postscript_name",
                    "weight_class","width_class","bold","italic","cmap_status","unicode_codepoints_count",
                    "cjk_basic_count","hiragana_count","katakana_count","bopomofo_count","table_errors","variable_axes")
              return {k:r.get(k) for k in keys}
          print("=== NO UNICODE CMAP ===")
          no=[r for r in rows if r.get("cmap_status")=="no_unicode_cmap"]
          print("count",len(no))
          for r in no: print(brief(r))
          print("=== MISSING POSTSCRIPT NAME ===")
          for r in rows:
              if not r.get("postscript_name"): print(brief(r))
          print("=== UNUSUAL WEIGHT CLASS 5 ===")
          for r in rows:
              if int(r.get("weight_class") or 0)==5: print(brief(r))
          print("=== BOLD FLAG WITH WEIGHT BELOW 700 ===")
          unusual=[r for r in rows if bool(r.get("bold")) and int(r.get("weight_class") or 0)<700]
          print("count",len(unusual))
          for r in unusual: print(brief(r))
          print("=== VARIABLE FONTS ===")
          axes=[]
          for r in rows:
              try:
                  a=json.loads(r.get("variable_axes") or "[]")
                  if a: axes.append((r.get("file"),r.get("face_index"),r.get("family_name"),r.get("weight_class"),a))
              except Exception: pass
          print("count",len(axes))
          for a in axes[:50]: print(a)
          print("=== NAME FIELD ODDITIES ===")
          for f in ("family_name","subfamily_name","full_name"):
              empty=[r for r in rows if not str(r.get(f) or "").strip()]
              print(f,"empty",len(empty))
          print("=== MAP ZEROES WHERE STATUS OK OR RECOVERED ===")
          for f in ("unicode_codepoints_count","cjk_basic_count","hiragana_count","katakana_count"):
              z=[r for r in rows if r.get("cmap_status") in ("ok","recovered") and int(r.get(f) or 0)==0]
              print(f,"zero_count",len(z),"examples",[(r.get("file"),r.get("face_index"),r.get("family_name"),r.get("cmap_status")) for r in z[:12]])
          print("=== END ===")
          PY
