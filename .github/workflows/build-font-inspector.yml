name: Build Windows portable Font Name Inspector

on:
  push:
    branches: [main]
    paths:
      - "tools/font_name_inspector.py"
      - "tools/tests/**"
      - "tools/requirements-build.txt"
      - "tools/README_免安装使用.md"
      - ".github/workflows/build-font-inspector.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14 (cloud only)
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tools/requirements-build.txt

      - name: Install build dependencies on GitHub runner
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements-build.txt

      - name: Run cmap recovery tests
        shell: pwsh
        run: |
          python -m unittest discover -s tools/tests -v

      - name: Build single-file Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name FontNameInspector --collect-all fontTools tools/font_name_inspector.py
          if (!(Test-Path "dist/FontNameInspector.exe")) {
            throw "PyInstaller did not produce dist/FontNameInspector.exe"
          }

      - name: Prepare portable ZIP
        shell: pwsh
        run: |
          Copy-Item "tools/README_免安装使用.md" "dist/使用说明.md"
          Compress-Archive -Path "dist/FontNameInspector.exe", "dist/使用说明.md" -DestinationPath "dist/FontNameInspector-Portable.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FontNameInspector-Windows-Portable
          path: |
            dist/FontNameInspector.exe
            dist/FontNameInspector-Portable.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish or update latest Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-portable-latest"
          gh release view $tag --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "dist/FontNameInspector.exe" "dist/FontNameInspector-Portable.zip" --repo "${{ github.repository }}" --clobber
          } else {
            gh release create $tag "dist/FontNameInspector.exe" "dist/FontNameInspector-Portable.zip" --repo "${{ github.repository }}" --prerelease --title "Font Name Inspector - Windows 免安装版（最新）" --notes "由 GitHub Actions 自动云编译。下载 ZIP 解压后双击 FontNameInspector.exe，无需在本机安装 Python 或 FontTools。"
          }
